[package]
name = "ghcc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fast conventional commit messages using GitHub Copilot"

[dependencies]
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
uuid = { version = "1.19.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
